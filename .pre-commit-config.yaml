repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy backend/src/
        language: system
        types: [python]
        pass_filenames: false

      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -recursive infra/
        language: system
        files: ^infra/.*\.tf$
        pass_filenames: false
