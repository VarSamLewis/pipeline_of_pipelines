[project]
name = "pipeline-of-pipelines"
version = "0.1.0"
description = "Auditable data-transformation platform for heterogeneous client files"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "alembic>=1.14.0",
    "polars>=1.12.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openai>=1.54.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.17",
    "fpdf2>=2.8.0",
    "workos>=5.0.0",
    "jinja2>=3.1.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-openpyxl>=3.1.5",
]

[tool.setuptools]
packages = ["repositories", "routers"]
py-modules = [
    "app",
    "artifact_store",
    "codegen",
    "config",
    "db_ops",
    "dependencies",
    "file_ops",
    "mapping",
    "mapping_specs",
    "models",
    "parser",
    "pipeline",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["data/output-folders/**", "data/object-store/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]
