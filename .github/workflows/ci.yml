name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.9
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend/src migrations tests scripts
      - run: uv run mypy backend/src
      - run: bash scripts/test-integration.sh
      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium
      - name: Browser integration test
        env:
          # The containerized integration suite may leave data/ owned by root.
          PIPELINE_DATA_DIR: ${{ runner.temp }}/pipeline-browser-data
        run: uv run pytest -q -m browser
      - run: git diff --check
      - run: docker build --tag pipeline-of-pipelines:ci .

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
