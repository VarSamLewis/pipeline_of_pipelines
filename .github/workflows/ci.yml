name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.9
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend/src tests scripts
      - run: uv run mypy backend/src
      - run: bash scripts/test-integration.sh
      - run: git diff --check
      - run: docker build --tag pipeline-of-pipelines:ci .
      - name: Verify migrations in runtime image
        run: |
          docker run --rm --entrypoint python pipeline-of-pipelines:ci -c '
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          script = ScriptDirectory.from_config(Config("/app/alembic.ini"))
          assert len(script.get_heads()) == 1
          '

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
