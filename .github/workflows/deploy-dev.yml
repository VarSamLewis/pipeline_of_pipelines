name: Deploy development

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy development
    runs-on: ubuntu-latest
    environment: development
    env:
      ENVIRONMENT: dev
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_session_secret_key: ${{ secrets.SESSION_SECRET_KEY }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_byok_encryption_key: ${{ secrets.BYOK_ENCRYPTION_KEY }}
      TF_VAR_clerk_secret_key: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check backend/src tests
      - run: uv run pytest
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image
        run: gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION="$REGION",_REPOSITORY="$REPOSITORY",_IMAGE_TAG="$GITHUB_SHA"
      - uses: hashicorp/setup-terraform@v3
      - name: Deploy infrastructure
        working-directory: infra
        env:
          TF_VAR_container_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/app:${{ github.sha }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=pipeline/$ENVIRONMENT" && terraform apply -input=false -auto-approve -var-file="environments/dev.tfvars" -var="container_image=$TF_VAR_container_image"
