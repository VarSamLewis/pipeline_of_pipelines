name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    env:
      ENVIRONMENT: prod
      REGION: ${{ vars.GCP_REGION }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
      TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_session_secret_key: ${{ secrets.SESSION_SECRET_KEY }}
      TF_VAR_byok_encryption_key: ${{ secrets.BYOK_ENCRYPTION_KEY }}
      TF_VAR_clerk_secret_key: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check backend/src tests
      - run: uv run pytest
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image
        run: |
          region="$(printf '%s' "$REGION" | tr -d '\r\n')"
          repository="$(printf '%s' "$REPOSITORY" | tr -d '\r\n')"
          build_id="$(gcloud builds submit --async --format='value(id)' --config cloudbuild.yaml --substitutions=_REGION="$region",_REPOSITORY="$repository",_IMAGE_TAG="$GITHUB_SHA")"
          while true; do
            status="$(gcloud builds describe "$build_id" --format='value(status)')"
            case "$status" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud builds describe "$build_id" --format='yaml(status,statusDetail)'
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done
      - uses: hashicorp/setup-terraform@v3
      - name: Deploy infrastructure
        working-directory: infra
        run: |
          region="$(printf '%s' "$REGION" | tr -d '\r\n')"
          project_id="$(printf '%s' "$PROJECT_ID" | tr -d '\r\n')"
          repository="$(printf '%s' "$REPOSITORY" | tr -d '\r\n')"
          terraform init -input=false -backend-config=environments/prod.backend.hcl
          terraform apply -input=false -auto-approve -var-file="environments/prod.tfvars" -var="container_image=$region-docker.pkg.dev/$project_id/$repository/app:$GITHUB_SHA"
