<button
  type="button"
  class="btn btn-sm llm-toggle"
  id="llm-toggle-{{ sidebar_id }}"
  onclick="toggleChatSidebar('{{ sidebar_id }}')"
  aria-expanded="false"
>LLM feedback</button>

<div class="chat-sidebar" id="chat-sidebar-{{ sidebar_id }}" hidden>
  <div class="chat-header">
    <div class="chat-header-row">
      <div>
        <strong>Feedback</strong>
        <span class="muted" style="font-size:0.8rem;">Describe what to fix</span>
      </div>
      <button
        type="button"
        class="btn btn-sm"
        onclick="toggleChatSidebar('{{ sidebar_id }}')"
        aria-label="Hide LLM feedback"
        title="Hide"
      >&times;</button>
    </div>
  </div>
  <div class="chat-messages" id="chat-messages-{{ sidebar_id }}">
    <div class="chat-placeholder">
      <p class="muted">Type feedback below to refine the mapping. The LLM will propose specific column-level changes.</p>
    </div>
  </div>
  <div class="chat-input">
    <form hx-post="/{{ page }}/{{ page_id }}/chat"
          hx-target="#chat-messages-{{ sidebar_id }}"
          hx-swap="beforeend"
          hx-indicator="#chat-spinner-{{ sidebar_id }}"
          class="chat-form">
      <textarea name="feedback"
                rows="2"
                placeholder="e.g. Add Q4 to the reporting_period expression..."
                required></textarea>
      <button class="btn btn-primary btn-sm" type="submit">
        <span id="chat-spinner-{{ sidebar_id }}" class="spinner" style="display:none;"></span>
        Send
      </button>
    </form>
  </div>
</div>

<script>
  function toggleChatSidebar(id) {
    var panel = document.getElementById('chat-sidebar-' + id);
    var toggle = document.getElementById('llm-toggle-' + id);
    var sidebar = panel && panel.closest('.layout-sidebar');
    if (!panel) return;
    if (panel.hidden) {
      panel.hidden = false;
      if (sidebar) sidebar.classList.remove('collapsed');
      if (toggle) toggle.setAttribute('aria-expanded', 'true');
    } else {
      panel.hidden = true;
      if (sidebar) sidebar.classList.add('collapsed');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    }
  }
</script>
